name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  crawler-log-shipper:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: crawler-log-shipper
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: crawler-log-shipper/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Bundle both Workers without deploying
        run: |
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
          npx wrangler deploy --dry-run -c wrangler.logpush.toml --outdir "$RUNNER_TEMP/logpush"
